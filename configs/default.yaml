project:
  name: cbb
  seed: 123
ingestion:
  year_range: [2008, 2025]
  exclude_years: [2020]  # COVID year, no NCAA tournament
  bart_torvik_base_url: "https://barttorvik.com/trank.php"
  team_tables_url: "https://barttorvik.com/team-tables_each.php"
  team_tables_year_range: [2008, 2025]
  team_tables_type: "R"  # R=regular season, P=postseason, T=tournament
  user_agent: "Mozilla/5.0"
  team_history_delay_sec: 0.8
  team_history_force_playwright: false
paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  data_external: data/external
  all_trank_team_tables: "data/raw/assembled/all_trank_team_tables.csv"
  all_trank_team_tables_tournament: "data/raw/assembled/all_trank_team_tables_tournament.csv"
  team_history_cache: "data/raw/team_history_cache.csv"
  team_history_cache_enriched: "data/raw/team_history_cache_enriched.csv"
  trank_postseason_final: "data/raw/trank_postseason_final.csv"
  models: models
  reports: reports
  figures: reports/figures
  output_training_csv: "data/processed/cbbtrainingdata"
  output_training_research: "data/processed/cbbtrainingdata_last2seasons"  # recent slice for feature engineering/research
  output_training_clean: "data/processed/cbb_training_clean"  # single clean dataset: no duplicate vars/rows, all outcomes
  bracket_csv: ""
# Research/feature-engineering cut: last N seasons of data (e.g. 2 = most recent 2 years)
research_last_n_seasons: 2
model:
  k_bradley_terry: 1.0
  n_sims: 10000
  ridge_alpha: 1.0
  optimize_ridge_alpha: true
  ridge_alpha_grid: [0.0, 0.01, 0.1, 0.3, 1.0, 3.0, 10.0]
  # Seed-stratified stack (14 hand-picked per-band ridges) on top of the general model.
  # Off: in walk-forward its MSE edge over the general model is not distinguishable from
  # zero, so the simpler model is the default. Evidence: Section 5 of the latest
  # reports/predictive_analysis_*.md. true = general model + seed stack.
  use_seed_models: false
  # The 6 coach_* columns of GEN_FEATURES in the general model (and so in the predround the
  # seed stack reads). Off by the same walk-forward MSE rule as use_seed_models: the general
  # model's MSE is not shown to be lower with them, and without them every general-model
  # feature predates the 2025 holdout. The columns stay in the training data. Evidence:
  # Headline of the latest reports/predictive_analysis_*.md. true = all of GEN_FEATURES.
  use_coach_features: false
